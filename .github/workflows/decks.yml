# Shared decks: check every pull request that touches decks/, and rebuild
# decks/index.json after a merge so the app sees the new deck.
name: Shared decks

on:
  pull_request:
    paths: ["decks/**"]
  push:
    branches: [main]
    paths: ["decks/**", "shmup_deck/app/games.json", "tools/build_deck_index.py"]

permissions:
  contents: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Validate the shared decks
        run: python3 tools/build_deck_index.py --check

  index:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Rebuild the index
        run: python3 tools/build_deck_index.py
      - name: Commit it if it changed
        run: |
          git config user.name "shmup-deck index"
          git config user.email "noreply@github.com"
          git add decks/index.json
          git diff --cached --quiet || git commit -m "Rebuild the shared decks index" && git push
